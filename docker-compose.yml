# Dev dependencies: run `docker compose up -d`, then `./gradlew :server:bootRun`.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: terminal_send
      POSTGRES_USER: terminal_send
      POSTGRES_PASSWORD: terminal_send
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terminal_send"]
      interval: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI with captured emails

volumes:
  pgdata:
