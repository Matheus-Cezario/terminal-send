# Dev dependencies: `docker compose up -d`, then `./gradlew :server:bootRun`.
# Whole stack in containers with the prod profile: `./gradlew :server:bootJar && docker compose --profile full up -d --build`.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: terminal_send
      POSTGRES_USER: terminal_send
      POSTGRES_PASSWORD: terminal_send
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terminal_send"]
      interval: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI with captured emails

  server:
    profiles: ["full"]
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TS_DB_URL: jdbc:postgresql://postgres:5432/terminal_send
      TS_DB_USER: terminal_send
      TS_DB_PASSWORD: terminal_send
      TS_JWT_SECRET: ${TS_JWT_SECRET:-compose-demo-secret-change-me-0123456789}
      TS_MAIL_HOST: mailpit
      TS_MAIL_PORT: 1025
      TS_MAIL_AUTH: "false"
      TS_MAIL_STARTTLS: "false"
      TS_MAIL_FROM: terminal-send <no-reply@terminal-send.local>
    ports:
      - "8080:8080"

volumes:
  pgdata:
